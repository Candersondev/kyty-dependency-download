
name: Download KytyPS5 Dependencies

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Clone KytyPS5 with submodules
        uses: actions/checkout@v4
        with:
          repository: KytyPS5/KytyPS5
          submodules: recursive
          path: KytyPS5

      - name: Package dependencies
        run: |
          tar -czf kyty-complete-source.tar.gz KytyPS5

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: kyty-complete-source
          path: kyty-complete-source.tar.gz
          retention-days: 7
